vibrate:
  name: Vibrate Wand
  description: >
    Vibrate Wand. Note: Due to wand firmware behavior, single vibrate commands
    fire a fixed ~800ms pulse regardless of requested duration.
  target:
    device:
      integration: magic_caster_wand
  fields:
    duration:
      name: Duration
      description: >
        Duration of vibrate in milliseconds. Note: Wand firmware outputs a fixed ~800ms
        pulse for single commands; sending buzz packets <500ms apart can extend the pulse.
      required: true
      default: 500
      selector:
        number:
          min: 0
          max: 5000
          unit_of_measurement: ms

set_led:
  name: Set LED
  description: Set the color of a specific LED group on the wand.
  target:
    device:
      integration: magic_caster_wand
  fields:
    group:
      name: LED Group
      description: The LED group to control.
      required: true
      default: TIP
      selector:
        select:
          options:
            - label: Tip
              value: TIP
            - label: Pommel
              value: POMMEL
            - label: Mid Lower
              value: MID_LOWER
            - label: Mid Upper
              value: MID_UPPER
    rgb_color:
      name: RGB Color
      description: The color in RGB format.
      required: true
      default: [255, 255, 255]
      selector:
        color_rgb:
    duration:
      name: Duration
      description: Duration of the light in milliseconds (0 for permanent).
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 30000
          unit_of_measurement: ms

send_macro:
  name: Send Macro
  description: >
    Send a sequence of macro commands to a wand or box. Each command in the
    list is converted into a Macro and sent as a single CONTROL (0x68) macro
    packet. Commands execute in order and may include LED transitions, delays,
    vibration, loop markers, loop counts, and wait instructions. The box has a
    single LED group (TIP) and no vibration motor, so buzz is ignored there.
  target:
    device:
      integration: magic_caster_wand
  fields:
    commands:
      name: Macro Commands
      description: >
        A list of macro commands executed in order. Each command is an object
        with one of the following keys:

        **changeled**
          - Change LED color on a specific group.
          - Fields:
              group: TIP | MID_UPPER | MID_LOWER | POMMEL (or 0–3)
              rgb: [R, G, B] (0–255 each)
              duration: Duration in ms (max 65535)

        **clear**
          - Clears all LEDs immediately.

        **delay**
          - Adds a delay before the next command.
          - Fields:
              delay: Duration in ms

        **buzz**
          - Vibrates the wand.
          - Fields:
              buzz: Duration in ms

        **set_loops**
          - Starts the loop for a number of loop iterations.
          - Fields:
              set_loops: Number of loops (1–255)

        **loop**
          - Marks the end of a loop block.

        **wait**
          - Waits for previous commands to finish.

      required: true
      selector:
        object:

clear_leds:
  name: Clear LEDs
  description: Turn off all LEDs on the wand.
  target:
    device:
      integration: magic_caster_wand

