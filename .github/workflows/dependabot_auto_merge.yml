name: Dependabot auto-merge
'on':
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependabot-auto-merge.yml@v1.1.4
