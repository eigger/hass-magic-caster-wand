# Shared standards; upstream action SHAs verified 2026-10-17.
name: Tests
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Test the current release and the unchanged declared HA support floor.
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50 # reviewed standards commit
    with:
      standards-ref: ca740d88b32fa5dcbc94c41fce2908450c76ed50
      domain: magic_caster_wand
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession", "bluetooth-sensor-state-data"]'
      ha-components: bluetooth_adapters camera
      test-profile: ha
      pytest-args: tests/components/magic_caster_wand/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50 # reviewed standards commit
    with:
      standards-ref: ca740d88b32fa5dcbc94c41fce2908450c76ed50
      domain: magic_caster_wand
      python-versions: '["3.13"]'
      requirements: requirements_test_min.txt
      expected-ha-version: '2025.4.0'
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession", "bluetooth-sensor-state-data"]'
      ha-components: bluetooth_adapters camera
      test-profile: ha
      pytest-args: tests/components/magic_caster_wand/ -v
