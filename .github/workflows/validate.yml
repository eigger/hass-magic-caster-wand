# Shared standards; upstream action SHAs verified 2026-10-17.
name: Validate
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 23 3 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@b54ac48102d6e326c6929071fdc02ba8fade794e # reviewed standards commit
    with:
      hassfest-core-ref: 'c517d079e1cd3831dd8aa547dd953e336830e846'
  standards:
    name: Central template compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.14'
    - uses: eigger/hass-repo-standards/actions/check-standards@b54ac48102d6e326c6929071fdc02ba8fade794e
