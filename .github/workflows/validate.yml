# Shared standards; upstream action SHAs verified 2026-10-17.
name: Validate
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 23 3 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50 # reviewed standards commit
    with:
      hassfest-core-ref: 'c517d079e1cd3831dd8aa547dd953e336830e846'
