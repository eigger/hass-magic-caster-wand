# Shared standards; upstream action SHAs verified 2026-10-17.
name: Update dependencies
'on':
  schedule:
  - cron: 41 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: dependency-update
  cancel-in-progress: false
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@v1.0.1 # reviewed standards release
    with:
      standards-ref: c9b4553184f9c27bdbe7bf8564eaf10153e9575b
      domain: magic_caster_wand
      packages: '["blesession"]'
      python-version: '3.14'
      ha-components: bluetooth_adapters camera
      test-profile: ha
      validation-command: python -m ruff check . && python -m ruff format --check . && python -m pytest tests/components/magic_caster_wand/ -v
